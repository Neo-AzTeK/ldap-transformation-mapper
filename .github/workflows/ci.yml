name: CI & Keycloak Compatibility Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Monday at 04:00 UTC to catch breaking changes in Keycloak releases
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      keycloak_version:
        description: 'Custom Keycloak version to test against'
        required: false
        default: '26.6.0'

jobs:
  matrix-build:
    name: Build & Test (Keycloak ${{ matrix.keycloak-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        keycloak-version:
          - '26.0.0'
          - '26.1.0'
          - '26.6.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit tests against Keycloak ${{ matrix.keycloak-version }}
        run: mvn clean verify -Dkeycloak.version=${{ matrix.keycloak-version }} -B

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-coverage-report-keycloak-${{ matrix.keycloak-version }}
          path: target/site/jacoco/

